name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Invariant checks
        run: node scripts/verify.js

      - name: Unit tests
        run: npm test -- --ci

      # Advisory only until the Expo toolchain catches up with its transitive
      # advisories: a critical in a runtime dependency fails the job, the rest
      # is reported. Dependabot (.github/dependabot.yml) opens the upgrades.
      - name: Dependency advisories (runtime, critical)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
